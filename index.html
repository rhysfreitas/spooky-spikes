<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Spooky Spikes Scoreboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: banner on a night band, sticky night control bar (division + view), then one stacked column of sections.
   Palette pulled from the Spooky Spikes banner: night-sky purple, pumpkin orange, moon gold, ocean teal. */
:root{
  --bg:#F6F2F9; --surface:#FFFFFF; --sunk:#EDE6F4; --fg:#1C1330; --muted:#635878; --line:#DED4EA;
  --accent:#D85E10; --accent-ink:#FFFFFF; --accent-soft:#FCE5D4; --violet:#4E2E86; --violet-soft:#EAE0F7;
  --good:#1A6F7A; --good-soft:#D9EEF0; --warn:#9A6A00; --warn-soft:#FBF0D2;
  /* always-dark brand surfaces (header, champion card) — identical in both themes */
  --night:#160E26; --night-2:#241840; --night-fg:#F4EEFA; --night-muted:#B9A9D4; --pumpkin:#FE7824; --gold:#FFB547;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130C21; --surface:#1E1533; --sunk:#291D44; --fg:#F4EEFA; --muted:#AE9FC6; --line:#372A52;
  --accent:#FE7824; --accent-ink:#1A0B02; --accent-soft:#3D2114; --violet:#B08CF0; --violet-soft:#2D2149;
  --good:#5CC8D2; --good-soft:#12313A; --warn:#FFB547; --warn-soft:#352812; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#130C21; --surface:#1E1533; --sunk:#291D44; --fg:#F4EEFA; --muted:#AE9FC6; --line:#372A52;
  --accent:#FE7824; --accent-ink:#1A0B02; --accent-soft:#3D2114; --violet:#B08CF0; --violet-soft:#2D2149;
  --good:#5CC8D2; --good-soft:#12313A; --warn:#FFB547; --warn-soft:#352812; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* header: banner + sticky night control bar */
.hero{background:var(--night)}
.hero h1{margin:0;max-width:1280px;margin-inline:auto}
.hero img{display:block;width:100%;height:auto;aspect-ratio:1280/318;max-width:100%}
@media (min-width:1281px){.hero img{-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}}
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;background:var(--night);color:var(--night-fg);border-bottom:2px solid var(--pumpkin);color-scheme:dark}
.top .wrap{padding-block:10px 12px;display:grid;gap:10px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.when{font-size:.82rem;color:var(--night-muted);display:flex;gap:8px;align-items:center}
.dot{display:inline-flex;align-items:center;gap:6px}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--night-muted)}
.dot.live::before{background:#5CC8D2;box-shadow:0 0 6px #5CC8D2} .dot.off::before{background:var(--gold)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.top .seg{background:var(--night-2)}
.seg.views{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:460px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;font-size:.92rem;color:var(--muted)}
.top .seg button{color:var(--night-muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.top .seg button[aria-pressed="true"]{background:var(--night-fg);color:var(--night)}
.top .seg.div button[aria-pressed="true"]{background:var(--pumpkin);color:#1A0B02;box-shadow:0 0 12px rgb(254 120 36 / .45)}

main .wrap{padding-block:16px 48px;display:grid;gap:22px}
.banner{background:var(--warn-soft);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-size:.9rem}
.banner b{color:var(--warn)}

/* section headings */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 10px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sec-h .aside{font-size:.85rem;color:var(--muted)}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.now{background:var(--accent);color:var(--accent-ink)}
.chip.done{background:var(--good-soft);color:var(--good)}
.chip.adv{background:var(--violet-soft);color:var(--violet)}

.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter label{font-size:.85rem;color:var(--muted)}
.filter select{min-width:0;max-width:100%;flex:1 1 220px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

/* games */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.game{display:grid;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.game:hover{border-color:var(--muted)}
.game.mine{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.game[disabled]{cursor:default;opacity:.75}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-width:0}
.row .nm{min-width:0;overflow-wrap:anywhere}
.sd{font-family:var(--f-num);font-size:.72rem;color:var(--muted)}
.row .sd{font-family:var(--f-num);font-size:.72rem;color:var(--muted);margin-right:6px}
.row .sc{font-family:var(--f-num);font-weight:600;font-size:1.25rem;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.row.win .nm{font-weight:700} .row.win .sc{color:var(--accent)}
.row.lose{color:var(--muted)}
.foot{font-size:.8rem;color:var(--muted)}
.game.played .foot{color:var(--good)}
.rest{background:transparent;border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);font-size:.9rem;display:grid;gap:4px}

/* standings */
.pools{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th{white-space:nowrap;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
th:nth-child(2){text-align:left}
td{white-space:nowrap;padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;vertical-align:top}
td.tm{white-space:normal;text-align:left;font-family:var(--f-body);overflow-wrap:anywhere}
td.rk{width:2.4em;text-align:left}
tr:last-child td{border-bottom:0}
tr.cut td{border-bottom:2px solid var(--violet)}
.rk b{display:inline-grid;place-items:center;min-width:1.9em;height:1.9em;border-radius:8px;background:var(--sunk);font-size:.85rem}
tr.in .rk b{background:var(--violet);color:var(--surface)}
.note{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.tie{margin-top:12px;background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:.9rem;display:grid;gap:8px}
.tie .btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;font-weight:700;font-size:.9rem}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:#C2362F;border-color:currentColor;background:transparent}
.btn[disabled]{opacity:.45;cursor:default}

/* bracket */
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:18px;align-items:start}
.stage{display:grid;gap:10px}
.stage h3{margin:0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.champ{background:radial-gradient(120% 140% at 90% 0%, #4A2A12 0%, var(--night-2) 45%, var(--night) 100%);color:var(--night-fg);border-radius:var(--r);padding:18px;display:grid;gap:6px;border:1px solid #3A2A58}
.champ .k{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}
.champ .podium{color:var(--night-muted)}
.champ .n{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1.15;text-wrap:balance}
.podium{display:grid;gap:4px;font-size:.92rem;color:var(--muted)}
.slot{color:var(--muted);font-style:italic}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(10 6 18 / .55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));display:grid;gap:14px;max-height:92%;overflow:auto}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.entry{display:grid;gap:8px}
.entry .who{font-weight:700;overflow-wrap:anywhere}
.stepper{display:grid;grid-template-columns:56px 1fr 56px;gap:8px}
.stepper button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:1.5rem;font-weight:700}
.stepper input{height:56px;width:100%;min-width:0;text-align:center;font-family:var(--f-num);font-size:1.8rem;font-weight:600;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-variant-numeric:tabular-nums}
.stepper input:focus{border-color:var(--accent);outline:none}
.err{color:#C2362F;font-size:.9rem;min-height:1.3em}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .err,:root:not([data-theme="light"]) .btn.danger{color:#FF8A80}}
:root[data-theme="dark"] .err,:root[data-theme="dark"] .btn.danger{color:#FF8A80}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.actions .left{margin-right:auto}

.filter .aside{font-size:.85rem;color:var(--muted)}
.teams{list-style:none;margin:0;padding:0;display:grid}
.team{display:grid;grid-template-columns:2.6em 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.team:last-child{border-bottom:0}
.seed{display:grid;place-items:center;height:2.2em;border-radius:8px;background:var(--violet-soft);color:var(--violet);font-family:var(--f-num);font-weight:600}
.tbody{display:grid;gap:8px;min-width:0}
.tmname{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-weight:700;overflow-wrap:anywhere}
.btn.sm{padding:4px 10px;font-size:.82rem;white-space:nowrap;flex:none}
.edit{display:grid;gap:8px}
.edit input{width:100%;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.edit .btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.opps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-family:var(--f-num);font-size:.82rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.opps span{display:grid;justify-items:center;background:var(--sunk);border-radius:6px;padding:3px 0}
.opps span.off{background:transparent;color:var(--muted)}
@media (min-width:1000px){.opps{grid-template-columns:repeat(8,1fr)}}
.opps i{font-style:normal;font-size:.62rem;color:var(--muted)}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:.92rem;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:transform .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(18px)}
.switch input:focus-visible + .track{outline:3px solid var(--accent);outline-offset:2px}
.gcount{font-size:.78rem;color:var(--muted)}
.org{border-top:1px solid var(--line);padding-top:14px;font-size:.88rem;color:var(--muted)}
.org summary{cursor:pointer;font-weight:700}
.org .body{display:grid;gap:10px;margin-top:10px}
.org input{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:9em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* ---------------- Tournament data ---------------- */
const DIVS = {
  W: { name: "Women's", courts: { A: [1, 2], B: [3, 4] }, pools: {
    A: ["Nicole Salmela / Kristi Winter", "Katie / Ari", "Shing / Liz", "Jenna Robbins / Megan Brinbaum", "Ruby Wong / Katie Buechel", "Katia Charov / Jen Humbert"],
    B: ["Anika Spencer / Jade Resto", "Miranda / Jackie", "Bri Corallo / Mia Fox", "Rylee Scott / RB", "Lauren Duran / Sharon", "Olivia Prymark / Paige"] } },
  M: { name: "Men's", courts: { A: [5, 6], B: [7, 8] }, pools: {
    A: ["Danny Reilly / Matt Gerpheide", "Omeed Ansari / Chris Chopin", "Caio / Thundersets", "Tynan Rodger / Vincenzo Roncance", "Ryan Fitzpatrick / Robert Hullbert", "Stephen Klutchka / Davey"],
    B: ["Luke Delacruz / Javi Allen", "Scott Graham / Ryan Elliot", "Jackson Walker / Jethro", "Andrew Choi / Greg S", "Neema Zahedi / Tritai", "Michael Ostertag / Andy Carroll"] } }
};
// Each round: [court 1 matchup, court 2 matchup] by pool seed; null = break
const ROUNDS = [[[1,5],[2,6]],[[3,5],[4,6]],[[1,3],[2,4]],[[3,6],[2,5]],[[1,4],[5,6]],[[3,4],null],[[2,3],[1,6]],[[4,5],[1,2]]];

const TEAM = {};
for (const d in DIVS) for (const p in DIVS[d].pools) DIVS[d].pools[p].forEach((name, i) => {
  const id = d + p + (i + 1); TEAM[id] = { id, div: d, pool: p, seed: i + 1, name };
});
const tn = id => (S.teams[id] && S.teams[id].name) || TEAM[id].name;
const teamsOf = (d, p) => Object.values(TEAM).filter(t => t.div === d && t.pool === p);
function poolGames(d, p) {
  const out = [];
  ROUNDS.forEach((rd, ri) => rd.forEach((m, ci) => {
    if (m) out.push({ id: `${d}${p}-r${ri + 1}c${ci + 1}`, div: d, pool: p, round: ri + 1, court: DIVS[d].courts[p][ci], a: d + p + m[0], b: d + p + m[1] });
  }));
  return out;
}

/* ---------------- Storage (Firebase or this device) ---------------- */
const S = { games: {}, flips: {}, teams: {} };
const store = {
  mode: "local",
  async init() {
    if (FIREBASE_CONFIG) {
      try {
        await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
        await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");
        firebase.initializeApp(FIREBASE_CONFIG);
        this.ref = firebase.database().ref(DB_ROOT);
        this.mode = "live";
        this.ref.on("value", snap => { const v = snap.val() || {}; S.games = v.games || {}; S.flips = v.flips || {}; S.teams = v.teams || {}; render(); },
          err => toast("Can't read scores: " + err.message));
        firebase.database().ref(".info/connected").on("value", s => setConn(s.val() ? "live" : "off"));
        return;
      } catch (e) { toast("Couldn't reach the score server. Using this device only."); }
    }
    this.mode = "local"; this.readLocal(); setConn("local");
    window.addEventListener("storage", e => { if (e.key === DB_ROOT) { this.readLocal(); render(); } });
  },
  readLocal() { try { const v = JSON.parse(localStorage.getItem(DB_ROOT) || "{}"); S.games = v.games || {}; S.flips = v.flips || {}; S.teams = v.teams || {}; } catch (e) {} },
  writeLocal() { try { localStorage.setItem(DB_ROOT, JSON.stringify(S)); } catch (e) {} render(); },
  set(path, val) {  // path like "games/WA-r1c1" or "flips/WA"
    if (this.mode === "live") return this.ref.child(path).set(val).catch(e => toast("Not saved: " + e.message));
    const [k, id] = path.split("/");
    if (val == null) delete S[k][id]; else S[k][id] = val;
    this.writeLocal();
  },
  clearAll() {  // scores and coin flips only; team names stay
    if (this.mode === "live") return this.ref.update({ games: null, flips: null }).catch(e => toast("Not cleared: " + e.message));
    S.games = {}; S.flips = {}; this.writeLocal();
  }
};
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
function setConn(m) {
  const el = document.getElementById("conn");
  el.className = "dot " + (m === "live" ? "live" : m === "off" ? "off" : "");
  el.textContent = m === "live" ? "Live" : m === "off" ? "Offline: scores will sync" : "This device only";
}

/* ---------------- Scoring rules ---------------- */
function validate(x, y) {
  if (!Number.isInteger(x) || !Number.isInteger(y) || x < 0 || y < 0) return "Enter both scores.";
  if (x === y) return "A game can't end in a tie.";
  const w = Math.max(x, y), l = Math.min(x, y);
  if (w < 21) return "The winner needs at least 21.";
  if (w - l < 2) return "The winner has to be ahead by 2.";
  if (w > 21 && w - l !== 2) return `Past 21, a game ends as soon as someone leads by 2, so ${w}–${l} can't happen.`;
  return null;
}
// A stored result counts only if it's for the same two teams the slot currently holds
function result(g) {
  const r = S.games[g.id];
  if (!r || !g.a || !g.b || r.a !== g.a || r.b !== g.b) return null;
  return r;
}
const winnerOf = (g) => { const r = result(g); return r ? (r.sa > r.sb ? r.a : r.b) : null; };
const loserOf = (g) => { const r = result(g); return r ? (r.sa > r.sb ? r.b : r.a) : null; };

/* ---------------- Standings + tiebreakers ----------------
   Order: wins → point differential → head-to-head (wins among the tied group)
   → points scored → organizer coin flip. */
function standings(d, p) {
  const ids = teamsOf(d, p).map(t => t.id);
  const st = Object.fromEntries(ids.map(id => [id, { w: 0, l: 0, pf: 0, pa: 0, gp: 0 }]));
  const played = [];
  for (const g of poolGames(d, p)) {
    const r = result(g); if (!r) continue;
    played.push(r);
    const A = st[r.a], B = st[r.b];
    A.pf += r.sa; A.pa += r.sb; B.pf += r.sb; B.pa += r.sa; A.gp++; B.gp++;
    if (r.sa > r.sb) { A.w++; B.l++; } else { B.w++; A.l++; }
  }
  const h2h = (id, grp) => played.filter(r => grp.includes(r.a) && grp.includes(r.b) && ((r.a === id && r.sa > r.sb) || (r.b === id && r.sb > r.sa))).length;
  const keys = [
    ["record", id => st[id].w],
    ["point differential", id => st[id].pf - st[id].pa],
    ["head-to-head", (id, grp) => h2h(id, grp)],
    ["points scored", id => st[id].pf]
  ];
  const notes = [], unresolved = [];
  const flips = S.flips[d + p] || {};
  function split(grp, k) {
    if (grp.length < 2) return grp;
    if (k === keys.length) {
      unresolved.push(grp);
      const f = flips[grp.slice().sort().join("_")];
      if (Array.isArray(f) && f.length === grp.length && grp.every(x => f.includes(x))) return f.slice();
      return grp.slice().sort((x, y) => TEAM[x].seed - TEAM[y].seed);
    }
    const fn = keys[k][1];
    const v = Object.fromEntries(grp.map(id => [id, fn(id, grp)]));
    const sorted = grp.slice().sort((x, y) => v[y] - v[x] || TEAM[x].seed - TEAM[y].seed);
    const buckets = [];
    for (const id of sorted) { const last = buckets[buckets.length - 1]; if (last && v[last[0]] === v[id]) last.push(id); else buckets.push([id]); }
    if (k > 0 && buckets.length > 1) notes.push({ grp, by: keys[k][0], prev: keys[k - 1][0] });
    return buckets.flatMap(b => split(b, k + 1));
  }
  const order = split(ids, 0);
  return { order, st, played: played.length, total: poolGames(d, p).length, complete: played.length === poolGames(d, p).length, notes, unresolved };
}

/* ---------------- Playoff bracket ----------------
   Pool winners get byes. QF1: A2 v B3, QF2: B2 v A3.
   SF1: A1 v winner QF2, SF2: B1 v winner QF1. Final + 3rd place. */
function bracket(d) {
  const A = standings(d, "A"), B = standings(d, "B");
  const seed = (P, i) => P.complete ? P.order[i] : null;
  const mk = (key, label, a, b, aL, bL) => ({ id: `${d}-${key}`, key, label, div: d, a, b, aL, bL });
  const QF1 = mk("QF1", "Quarterfinal 1", seed(A, 1), seed(B, 2), "Pool A #2", "Pool B #3");
  const QF2 = mk("QF2", "Quarterfinal 2", seed(B, 1), seed(A, 2), "Pool B #2", "Pool A #3");
  const SF1 = mk("SF1", "Semifinal 1", seed(A, 0), winnerOf(QF2), "Pool A #1", "Winner of QF 2");
  const SF2 = mk("SF2", "Semifinal 2", seed(B, 0), winnerOf(QF1), "Pool B #1", "Winner of QF 1");
  const F = mk("F", "Final", winnerOf(SF1), winnerOf(SF2), "Winner of SF 1", "Winner of SF 2");
  const P3 = mk("P3", "3rd place", loserOf(SF1), loserOf(SF2), "Loser of SF 1", "Loser of SF 2");
  return { A, B, QF1, QF2, SF1, SF2, F, P3, all: [QF1, QF2, SF1, SF2, F, P3] };
}
function findGame(id) {
  for (const d in DIVS) {
    for (const p of ["A", "B"]) { const g = poolGames(d, p).find(x => x.id === id); if (g) return g; }
    const g = bracket(d).all.find(x => x.id === id); if (g) return g;
  }
  return null;
}

/* ---------------- UI state ---------------- */
const ls = { get(k, f) { try { return localStorage.getItem("ss-ui-" + k) ?? f; } catch (e) { return f; } }, set(k, v) { try { localStorage.setItem("ss-ui-" + k, v); } catch (e) {} } };
const UI = { div: ls.get("div", "W"), view: ls.get("view", "sched"), pool: ls.get("pool", "all"), pick: {}, edit: null, showGames: ls.get("showGames", "0") === "1" };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ---------------- Rendering ---------------- */
function render() {
  for (const d of ["W", "M"]) document.getElementById("d-" + d).setAttribute("aria-pressed", UI.div === d);
  for (const v of ["sched", "stand", "brk", "teams"]) document.getElementById("v-" + v).setAttribute("aria-pressed", UI.view === v);
  let html = "";
  if (store.mode === "local") html += `<div class="banner"><b>Demo mode.</b> Scores are saved on this device only. Add the Firebase settings to share live scores with everyone.</div>`;
  html += UI.view === "sched" ? viewSchedule() : UI.view === "stand" ? viewStandings() : UI.view === "teams" ? viewTeams() : viewBracket();
  html += orgTools();
  const app = document.getElementById("app");
  const open = app.querySelector(".org")?.open;
  // keep anything typed in the team editor when live scores re-render the page
  const sameEdit = app.dataset.edit === String(UI.edit);
  const keep = (sameEdit ? ["ed-1", "ed-2", "resetTxt"] : ["resetTxt"]).map(id => [id, document.getElementById(id)?.value, document.activeElement?.id === id]);
  app.innerHTML = html; app.dataset.edit = String(UI.edit);
  if (open) app.querySelector(".org").open = true;
  for (const [id, v, f] of keep) { const el = document.getElementById(id); if (el && v != null) { el.value = v; if (f) el.focus(); } }
}

function gameCard(g, metaL, metaR) {
  const r = result(g);
  const ready = g.a && g.b;
  const line = (id, sc, isWin, label) => {
    const cls = r ? (isWin ? "win" : "lose") : "";
    const nm = id ? `<span class="nm">${g.round ? `<span class="sd">#${TEAM[id].seed}</span>` : ""}${esc(tn(id))}</span>` : `<span class="nm slot">${esc(label)}</span>`;
    return `<div class="row ${cls}">${nm}<span class="sc">${r ? sc : ""}</span></div>`;
  };
  const stale = !r && S.games[g.id] && ready ? `<div class="foot">An earlier score was for different teams. Enter it again.</div>` : "";
  const foot = r ? `<div class="foot">Final · tap to edit</div>` : ready ? (stale || `<div class="foot">Tap to enter the score</div>`) : `<div class="foot">Waiting on earlier results</div>`;
  return `<button class="game ${r ? "played" : ""} " data-act="score" data-id="${g.id}" ${ready ? "" : "disabled"}>
    <div class="meta"><span>${metaL}</span><span>${metaR || ""}</span></div>
    ${line(g.a, r?.sa, r && r.sa > r.sb, g.aL)}${line(g.b, r?.sb, r && r.sb > r.sa, g.bL)}${foot}</button>`;
}

function viewSchedule() {
  const d = UI.div;
  const pools = UI.pool === "A" || UI.pool === "B" ? [UI.pool] : ["A", "B"];
  const pb = (v, label) => `<button data-act="pool" data-v="${v}" aria-pressed="${UI.pool === v || (v === "all" && pools.length === 2)}">${label}</button>`;
  let h = `<section class="filter"><div class="seg" role="group" aria-label="Pool">${pb("all", "Both pools")}${pb("A", "Pool A")}${pb("B", "Pool B")}</div>
    <span class="aside">${pools.map(p => `Pool ${p}: courts ${DIVS[d].courts[p].join(" & ")}`).join(" · ")}</span></section>`;
  const all = pools.flatMap(p => poolGames(d, p));
  let nowMarked = false;
  ROUNDS.forEach((rd, ri) => {
    const rn = ri + 1;
    const games = all.filter(g => g.round === rn);
    const done = games.every(g => result(g));
    let chip = "";
    if (done) chip = `<span class="chip done">Done</span>`;
    else if (!nowMarked) { chip = `<span class="chip now">Up next</span>`; nowMarked = true; }
    let cards = "";
    for (const p of pools) {
      cards += games.filter(g => g.pool === p).map(g => gameCard(g, `Court ${g.court}`, `Pool ${p}`)).join("");
      if (rd[1] === null) cards += `<div class="rest"><b>Court ${DIVS[d].courts[p][1]} · Pool ${p}</b>15-minute break</div>`;
    }
    const sit = pools.map(p => {
      const playing = new Set(games.filter(g => g.pool === p).flatMap(g => [g.a, g.b]));
      const out = teamsOf(d, p).filter(t => !playing.has(t.id));
      return out.length ? `Pool ${p}: ${out.map(t => "#" + t.seed + " " + esc(tn(t.id))).join(", ")}` : "";
    }).filter(Boolean).join("<br>");
    h += `<section><div class="sec-h"><h2>Round ${rn}</h2>${chip}</div><div class="games">${cards}</div>
      ${sit ? `<p class="note">Sitting out · ${sit}</p>` : ""}</section>`;
  });
  return h;
}

function viewTeams() {
  const d = UI.div;
  const card = p => {
    const games = poolGames(d, p);
    const rows = teamsOf(d, p).map(t => {
      const mine = games.filter(g => g.a === t.id || g.b === t.id);
      const opp = ROUNDS.map((_, ri) => { const g = mine.find(x => x.round === ri + 1); return g ? "#" + TEAM[g.a === t.id ? g.b : g.a].seed : "–"; });
      const editing = UI.edit === t.id;
      const [p1, p2] = tn(t.id).split(" / ");
      const body = editing
        ? `<div class="edit"><input id="ed-1" value="${esc(p1 || "")}" aria-label="Player 1" placeholder="Player 1" autocomplete="off">
             <input id="ed-2" value="${esc(p2 || "")}" aria-label="Player 2" placeholder="Player 2" autocomplete="off">
             <div class="btns">${S.teams[t.id] ? `<button class="btn ghost" data-act="tmreset" data-id="${t.id}">Use original names</button>` : ""}
             <button class="btn ghost" data-act="tmcancel">Cancel</button><button class="btn pri" data-act="tmsave" data-id="${t.id}">Save</button></div></div>`
        : `<div class="tmname"><span>${esc(tn(t.id))}${S.teams[t.id] ? ` <span class="chip">Edited</span>` : ""}</span><button class="btn ghost sm" data-act="tmedit" data-id="${t.id}">Edit</button></div>`;
      const sched = UI.showGames ? `<div class="opps" aria-label="Opponents by round">${opp.map((o, i) => `<span class="${o === "–" ? "off" : ""}"><i>R${i + 1}</i>${o === "–" ? "sits" : "vs " + o}</span>`).join("")}</div>
        <div class="gcount">${mine.length} games</div>` : "";
      return `<li class="team"><span class="seed">#${t.seed}</span><div class="tbody">${body}${sched}</div></li>`;
    }).join("");
    return `<div class="card"><div class="sec-h"><h2>Pool ${p}</h2><span class="aside">Courts ${DIVS[d].courts[p].join(" & ")} · ${games.length} games</span></div><ul class="teams">${rows}</ul></div>`;
  };
  return `<section><div class="sec-h"><h2>${DIVS[d].name} teams</h2><label class="switch"><input type="checkbox" id="showGames" data-act="showgames" ${UI.showGames ? "checked" : ""}><span class="track" aria-hidden="true"></span>Show games</label></div>
    <div class="pools">${card("A")}${card("B")}</div></section>`;
}

function poolTable(d, p) {
  const s = standings(d, p);
  const rows = s.order.map((id, i) => {
    const t = TEAM[id], x = s.st[id], pd = x.pf - x.pa;
    const cls = (i < 3 ? "in" : "") + (i === 2 ? " cut" : "");
    return `<tr class="${cls}"><td class="rk"><b>${i + 1}</b></td><td class="tm"><span class="sd">#${t.seed}</span> ${esc(tn(id))}</td><td>${x.w}–${x.l}</td><td>${pd > 0 ? "+" : ""}${pd}</td><td>${x.pf}</td></tr>`;
  }).join("");
  let extra = "";
  if (s.complete) {
    extra += s.notes.map(n => `<p class="note">${n.grp.map(id => esc(tn(id))).join(", ")}: tied on ${n.prev}, separated by ${n.by}.</p>`).join("");
    for (const grp of s.unresolved) {
      const key = grp.slice().sort().join("_");
      const saved = S.flips[d + p]?.[key];
      const pick = UI.pick[d + p + key] || [];
      const names = grp.map(id => `<b>${esc(tn(id))}</b>`).join(" and ");
      if (saved) {
        extra += `<div class="tie"><div>${names} were tied after every tiebreaker. Coin flip order is saved.</div><div class="btns"><button class="btn ghost" data-act="flipredo" data-pool="${d + p}" data-key="${key}">Redo coin flip</button></div></div>`;
      } else {
        extra += `<div class="tie"><div>${names} are tied after record, point differential, head-to-head, and points scored. <b>Organizer:</b> flip a coin, then tap the teams from first to last.</div>
          <div class="btns">${grp.map(id => { const n = pick.indexOf(id); return `<button class="btn ${n >= 0 ? "pri" : ""}" data-act="flippick" data-pool="${d + p}" data-key="${key}" data-team="${id}" ${n >= 0 ? "disabled" : ""}>${n >= 0 ? n + 1 + ". " : ""}${esc(tn(id))}</button>`; }).join("")}
          ${pick.length ? `<button class="btn ghost" data-act="flipreset" data-pool="${d + p}" data-key="${key}">Start over</button>` : ""}</div></div>`;
      }
    }
  }
  const status = s.complete ? `<span class="chip done">Final</span>` : `<span class="aside">${s.played} of ${s.total} games played</span>`;
  return `<div class="card"><div class="sec-h"><h2>Pool ${p}</h2>${status}</div>
    <div class="tbl-wrap"><table><thead><tr><th></th><th>Team</th><th>W–L</th><th>PD</th><th>PF</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">Top 3 advance${s.complete ? "" : " (standings so far)"}. Pool winners get a bye to the semifinals.</p>${extra}</div>`;
}
function viewStandings() {
  const d = UI.div;
  return `<section><div class="sec-h"><h2>${DIVS[d].name} standings</h2><span class="aside">Ranked by record, then point differential, head-to-head, points scored</span></div>
    <div class="pools">${poolTable(d, "A")}${poolTable(d, "B")}</div></section>`;
}

function viewBracket() {
  const d = UI.div, b = bracket(d);
  let pre = "";
  if (!b.A.complete || !b.B.complete) pre = `<div class="banner">The bracket fills in as each pool finishes. Pool A: ${b.A.played}/${b.A.total} games, Pool B: ${b.B.played}/${b.B.total} games.</div>`;
  const champ = winnerOf(b.F);
  let top = "";
  if (champ) {
    const third = winnerOf(b.P3);
    top = `<div class="champ"><div class="k">${DIVS[d].name} champions</div><div class="n">${esc(tn(champ))}</div>
      <div class="podium"><span>2nd: ${esc(tn(loserOf(b.F)))}</span>${third ? `<span>3rd: ${esc(tn(third))}</span>` : ""}</div></div>`;
  }
  const stage = (title, ms) => `<div class="stage"><h3>${title}</h3>${ms.map(m => gameCard(m, m.label, "")).join("")}</div>`;
  return `${pre}${top}<section><div class="sec-h"><h2>${DIVS[d].name} playoffs</h2><span class="aside">One game to 21, win by 2</span></div>
    <div class="stages">${stage("Quarterfinals", [b.QF1, b.QF2])}${stage("Semifinals", [b.SF1, b.SF2])}${stage("Medal games", [b.F, b.P3])}</div></section>`;
}

function orgTools() {
  return `<details class="org"><summary>Organizer tools</summary><div class="body">
    <div>Scores are stored ${store.mode === "local" ? "on this device only" : "online and shared with everyone who opens this page"}.</div>
    <div>To erase every score and coin flip in both divisions, type RESET and press Clear. Team names are kept.</div>
    <div class="filter"><input id="resetTxt" autocomplete="off" aria-label="Type RESET to confirm"><button class="btn danger" data-act="reset">Clear all scores</button></div>
  </div></details>`;
}

/* ---------------- Score sheet ---------------- */
let sheet = null;
function openSheet(id) {
  const g = findGame(id); if (!g || !g.a || !g.b) return;
  const r = result(g);
  sheet = { g, sa: r ? r.sa : "", sb: r ? r.sb : "", force: false };
  const title = g.round ? `Round ${g.round} · Court ${g.court}` : g.label;
  document.getElementById("modal").innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
    <div><div class="meta"><span>${DIVS[g.div].name}${g.pool ? " · Pool " + g.pool : ""}</span></div><h2 id="sh-t">${esc(title)}</h2></div>
    ${["a", "b"].map(k => `<div class="entry"><label class="who" for="in-${k}">${esc(tn(g[k]))}</label>
      <div class="stepper"><button data-act="step" data-k="${k}" data-n="-1" aria-label="Minus one">−</button>
      <input id="in-${k}" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="${sheet["s" + k]}" data-act="in" data-k="${k}" placeholder="0">
      <button data-act="step" data-k="${k}" data-n="1" aria-label="Plus one">+</button></div></div>`).join("")}
    <div class="err" id="sh-err" aria-live="polite"></div>
    <div class="actions">${r ? `<button class="btn danger left" data-act="clear">Clear score</button>` : ""}
      <button class="btn ghost" data-act="close">Cancel</button><button class="btn pri" id="sh-save" data-act="save">Save score</button></div>
  </div></div>`;
  setTimeout(() => document.getElementById("in-a")?.focus(), 50);
}
function closeSheet() { sheet = null; document.getElementById("modal").innerHTML = ""; }
function sheetVals() {
  const a = document.getElementById("in-a").value.trim(), b = document.getElementById("in-b").value.trim();
  return [a === "" ? NaN : Number(a), b === "" ? NaN : Number(b)];
}
function saveSheet() {
  const [sa, sb] = sheetVals();
  const err = validate(sa, sb);
  const errEl = document.getElementById("sh-err"), btn = document.getElementById("sh-save");
  const hardFail = !Number.isInteger(sa) || !Number.isInteger(sb) || sa === sb || sa < 0 || sb < 0;
  if (err && (!sheet.force || hardFail)) {
    errEl.textContent = err + (hardFail ? "" : " Check the score, or tap Save anyway.");
    if (!hardFail) { sheet.force = true; btn.textContent = "Save anyway"; }
    return;
  }
  const g = sheet.g;
  store.set("games/" + g.id, { a: g.a, b: g.b, sa, sb, at: Date.now() });
  closeSheet(); toast("Score saved");
}

/* ---------------- Events ---------------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act;
  if (a === "close") { if (t === e.target || t.tagName === "BUTTON") closeSheet(); return; }
  if (a === "div") { UI.div = t.dataset.v; ls.set("div", UI.div); render(); }
  else if (a === "view") { UI.view = t.dataset.v; ls.set("view", UI.view); render(); window.scrollTo(0, 0); }
  else if (a === "score") openSheet(t.dataset.id);
  else if (a === "showgames") { UI.showGames = t.checked; ls.set("showGames", t.checked ? "1" : "0"); render(); }
  else if (a === "pool") { UI.pool = t.dataset.v; ls.set("pool", UI.pool); render(); }
  else if (a === "tmedit") { UI.edit = t.dataset.id; render(); document.getElementById("ed-1")?.focus(); }
  else if (a === "tmcancel") { UI.edit = null; render(); }
  else if (a === "tmreset") { store.set("teams/" + t.dataset.id, null); UI.edit = null; render(); toast("Original names restored"); }
  else if (a === "tmsave") {
    const p1 = document.getElementById("ed-1").value.trim(), p2 = document.getElementById("ed-2").value.trim();
    if (!p1) { toast("Enter at least one player name"); return; }
    const name = p2 ? p1 + " / " + p2 : p1;
    UI.edit = null;
    store.set("teams/" + t.dataset.id, name === TEAM[t.dataset.id].name ? null : { name });
    render(); toast("Team saved");
  }
  else if (a === "step") {
    const inp = document.getElementById("in-" + t.dataset.k);
    const v = Math.max(0, (parseInt(inp.value, 10) || 0) + Number(t.dataset.n));
    inp.value = v; resetForce();
  }
  else if (a === "save") saveSheet();
  else if (a === "clear") { store.set("games/" + sheet.g.id, null); closeSheet(); toast("Score cleared"); }
  else if (a === "flippick") {
    const k = t.dataset.pool + t.dataset.key, arr = (UI.pick[k] = UI.pick[k] || []);
    arr.push(t.dataset.team);
    const grp = t.dataset.key.split("_");
    if (arr.length === grp.length - 1) arr.push(grp.find(x => !arr.includes(x)));
    if (arr.length === grp.length) {
      const flips = Object.assign({}, S.flips[t.dataset.pool] || {}, { [t.dataset.key]: arr.slice() });
      delete UI.pick[k];
      store.set("flips/" + t.dataset.pool, flips); toast("Coin flip saved");
    }
    render();
  }
  else if (a === "flipreset") { delete UI.pick[t.dataset.pool + t.dataset.key]; render(); }
  else if (a === "flipredo") {
    const flips = Object.assign({}, S.flips[t.dataset.pool] || {}); delete flips[t.dataset.key];
    store.set("flips/" + t.dataset.pool, Object.keys(flips).length ? flips : null);
  }
  else if (a === "reset") {
    const v = document.getElementById("resetTxt").value.trim();
    if (v !== "RESET") { toast("Type RESET in the box first"); return; }
    store.clearAll(); toast("All scores cleared");
  }
});
function resetForce() { if (sheet && sheet.force) { sheet.force = false; document.getElementById("sh-save").textContent = "Save score"; } document.getElementById("sh-err").textContent = ""; }
document.addEventListener("input", e => {
  if (e.target.dataset.act === "in") { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 2); resetForce(); }
});
document.addEventListener("keydown", e => {
  if (!sheet) return;
  if (e.key === "Escape") closeSheet();
  if (e.key === "Enter") saveSheet();
});
let toastT;
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 2200); }

render();
store.init().then(render);
</script>

</body></html>
